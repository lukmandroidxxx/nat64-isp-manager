# NAT64 ISP Manager - application components only.
#
# This stack runs PostgreSQL, the FastAPI control plane and an nginx reverse
# proxy. It intentionally does NOT grant container access to the host's Jool,
# BIND9, nftables or netplan state. The privileged data-plane helper must run
# natively on the Linux gateway; see docs/02-INSTALLATION.md.
#
# Quick start:
#   cp .env.example .env
#   # edit SECRET_KEY, APP_ENCRYPTION_KEY, POSTGRES_PASSWORD and the admin password
#   docker compose up -d --build
#   open http://127.0.0.1:8080
#
# The database password is shared by the db and api services. Keep .env mode
# 0600 and never commit it.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nat64}
      POSTGRES_USER: ${POSTGRES_USER:-nat64}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nat64} -d ${POSTGRES_DB:-nat64}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nat64

  api:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nat64}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-nat64}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.invalid}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      SERVE_FRONTEND: "true"
      FRONTEND_DIST: /opt/nat64-manager/frontend/dist
      BACKUP_DIR: /var/lib/nat64-manager/backups
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-127.0.0.1,localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080}
      # App-only stack: no host helper, no collector, no fabricated data.
      HOST_CONTROL_MODE: disabled
      COLLECTOR_ENABLED: "false"
      DEMO_MODE: "false"
      RATE_LIMIT_ENABLED: "true"
    volumes:
      - nat64_data:/var/lib/nat64-manager
    expose:
      - "8000"
    networks:
      - nat64

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/compose-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nat64

volumes:
  pgdata:
  nat64_data:

networks:
  nat64:
    driver: bridge
