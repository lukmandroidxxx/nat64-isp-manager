# Compose-only nginx configuration. The production template in
# deploy/nginx/nat64-manager.conf terminates TLS and redirects HTTP; this one
# keeps the local stack simple on http://127.0.0.1:8080.

upstream nat64_manager_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://nat64_manager_api;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://nat64_manager_api/health;
        access_log off;
    }
}
