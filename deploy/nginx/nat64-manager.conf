# NAT64 ISP Manager - nginx reverse proxy.
#
# Install at /etc/nginx/conf.d/nat64-manager.conf (or sites-available) and edit
# server_name plus the TLS paths. The backend serves the built SPA and the API
# from the same origin, so there is only one upstream.
#
# This template targets a native gateway where uvicorn listens on loopback.
# The Docker Compose stack uses deploy/nginx/compose-nginx.conf with "api:8000"
# instead; do not mix the two files.

upstream nat64_manager_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nat64.example.net;

    # Keep ACME HTTP-01 available if TLS is terminated here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nat64.example.net;

    ssl_certificate     /etc/letsencrypt/live/nat64.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nat64.example.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploaded backup files and API JSON are small; keep a hard ceiling.
    client_max_body_size 16m;
    client_body_timeout 30s;

    # WebSocket upgrade support (the UI polls over HTTP, but keep this ready).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    # The backend sets CSP, X-Frame-Options, HSTS and the other security
    # headers. Do not duplicate them here.
    location / {
        proxy_pass http://nat64_manager_api;
    }

    # Long-running CSV downloads and backup downloads.
    location ~ ^/api/v1/(sessions|clients|audit)/export {
        proxy_pass http://nat64_manager_api;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://nat64_manager_api/health;
        access_log off;
    }
}
